<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> NEXUS — Collaboration Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #05070d;
            color: #e8ecf5;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* ===== CARD ===== */
        .auth-card {
            background: rgba(5, 7, 13, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 2.5rem 2.8rem;
            border: 1px solid rgba(255, 45, 85, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            animation: card-in 0.6s ease both;
        }

        @keyframes card-in {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff2d55, #00d4ff, #7c3aed, transparent);
            animation: header-scan 3s linear infinite;
        }

        @keyframes header-scan {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .auth-card .logo-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .auth-card h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #ff2d55, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .auth-card .sub {
            text-align: center;
            color: #556688;
            font-size: 0.8rem;
            margin-bottom: 2rem;
        }

        .auth-card .sub i {
            color: #ff2d55;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #667a9a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            color: #ff2d55;
            margin-right: 6px;
        }

        .form-group .input-wrap {
            position: relative;
        }

        .form-group .input-wrap i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #334466;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
            color: #e8ecf5;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 45, 85, 0.3);
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.05);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #334466;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            padding: 0.8rem 1rem;
        }

        .form-group .input-wrap.textarea-wrap i {
            top: 1rem;
            transform: none;
        }

        .form-group .input-wrap.textarea-wrap textarea {
            padding-left: 2.8rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group input {
            padding-left: 2.8rem;
        }

        /* ===== BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ff2d55, #ff6b8a);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 45, 85, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit i {
            font-size: 1.1rem;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #556688;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: #ff6b8a;
        }

        .back-link a i {
            color: #ff2d55;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(5, 7, 13, 0.95);
            backdrop-filter: blur(20px);
            padding: 1rem 1.8rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            color: #e8ecf5;
            font-size: 0.9rem;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: rgba(52, 211, 153, 0.2); }
        .toast.error { border-color: rgba(255, 45, 85, 0.2); }
        .toast i { margin-right: 10px; }
        .toast.success i { color: #34d399; }
        .toast.error i { color: #ff2d55; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .auth-card { padding: 1.8rem 1.5rem; }
            .auth-card h1 { font-size: 1.3rem; }
            .form-row { grid-template-columns: 1fr; }
            .container { padding: 0 1rem; }
        }
    </style>
</head>
<body>

<!-- ===== 3D BACKGROUND ===== -->
<div id="bg3d"></div>
<div class="vignette"></div>

<!-- ===== CONTAINER ===== -->
<div class="container">

    <!-- ===== CARD ===== -->
    <div class="auth-card">

        <div class="logo-icon"></div>
        <h1>Collaboration</h1>
        <div class="sub"><i class="fas fa-skull"></i> join our team <i class="fas fa-skull"></i></div>

        <!-- ===== FORM ===== -->
        <form id="collabForm" onsubmit="submitCollaboration(event)">

            <!-- NAME & LASTNAME -->
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> First Name</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="firstName" placeholder="Your first name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Last Name</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="lastName" placeholder="Your last name" required>
                    </div>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
            </div>

            <!-- AGE -->
            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> Age</label>
                <div class="input-wrap">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="number" id="age" placeholder="Your age (13+)" min="13" max="99" required>
                </div>
            </div>

            <!-- NOTE -->
            <div class="form-group">
                <label><i class="fas fa-pen"></i> Why do you want to join?</label>
                <div class="input-wrap textarea-wrap">
                    <i class="fas fa-pen"></i>
                    <textarea id="note" placeholder="Tell us why you want to join the NEXUS team..."></textarea>
                </div>
            </div>

            <!-- SUBMIT -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Send Request
            </button>

        </form>

        <!-- BACK LINK -->
        <div class="back-link">
            <a href="cm.html"><i class="fas fa-arrow-left"></i> Back to Database</a>
        </div>

    </div>

</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Success!</span>
</div>

<!-- ===== JAVASCRIPT ===== -->
<script>
    // ===== 3D BACKGROUND =====
    function init3DBackground() {
        const container = document.getElementById('bg3d');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const particleCount = 2000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 100;
            positions[i + 1] = (Math.random() - 0.5) * 100;
            positions[i + 2] = (Math.random() - 0.5) * 100;

            const colorChoice = Math.random();
            if (colorChoice < 0.33) {
                colors[i] = 1; colors[i + 1] = 0.18; colors[i + 2] = 0.33;
            } else if (colorChoice < 0.66) {
                colors[i] = 0; colors[i + 1] = 0.83; colors[i + 2] = 1;
            } else {
                colors[i] = 0.48; colors[i + 1] = 0.23; colors[i + 2] = 0.93;
            }
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        camera.position.z = 30;

        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.x += 0.0005;
            particles.rotation.y += 0.0008;
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ===== TOAST =====
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        toast.className = 'toast ' + type;
        toastMessage.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // ===== SUBMIT FORM =====
    function submitCollaboration(e) {
        e.preventDefault();

        // گرفتن اطلاعات از فرم
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const age = document.getElementById('age').value;
        const note = document.getElementById('note').value.trim();

        // بررسی اینکه همه فیلدها پر شده باشند
        if (!firstName || !lastName || !email || !age) {
            showToast('⚠️ Please fill in all required fields!', 'error');
            return;
        }

        if (parseInt(age) < 13) {
            showToast('⚠️ You must be 13 or older to join!', 'error');
            return;
        }

        // ساخت پیام برای ایمیل
        const subject = encodeURIComponent(' New Collaboration Request - NEXUS');
        const body = encodeURIComponent(
            '📋 New Collaboration Request\n\n' +
            '━━━━━━━━━━━━━━━━━━━━━━━━━\n\n' +
            '👤 First Name: ' + firstName + '\n' +
            '👤 Last Name: ' + lastName + '\n' +
            '📧 Email: ' + email + '\n' +
            '🎂 Age: ' + age + '\n\n' +
            '📝 Why do you want to join?\n' +
            '━━━━━━━━━━━━━━━━━━━━━━━━━\n' +
            (note || 'No message provided.') + '\n\n' +
            '━━━━━━━━━━━━━━━━━━━━━━━━━\n' +
            '📅 Sent from NEXUS Collaboration Form'
        );

        // باز کردن ایمیل با mailto
        window.location.href = 'mailto:darksword123@gmail.com?subject=' + subject + '&body=' + body;

        // نمایش پیام موفقیت
        showToast('✅ Request sent successfully! We will contact you soon.', 'success');

        // ریست کردن فرم بعد از 2 ثانیه
        setTimeout(() => {
            document.getElementById('collabForm').reset();
        }, 2000);
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
        init3DBackground();
    });
</script>

</body>
</html>
